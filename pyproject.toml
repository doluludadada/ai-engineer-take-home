[project]
name = "ai-engineer-take-home"
version = "0.1.0"
description = "AI 開發工程師筆試作答：Agent 程式碼審查、訂單 MCP 工具伺服器、個資遮罩模組"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "httpx2>=2.16",
    "mcp>=2.3",
    "openai>=1.40",
    "pydantic>=2.12.3",
    "pydantic-settings[yaml]>=2.11.0",
    "pyjwt[crypto]>=2.8",
    "sqlalchemy[asyncio]>=2.0.45",
    "sqlmodel>=0.0.31",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "order_tools/src"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 135
target-version = "py314"
extend-exclude = ["_ai_first_version", "q1_review/original_agent.py"]

[tool.ruff.lint]
select = ["B", "C90", "E", "F", "I", "UP", "SIM"]
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = false
known-first-party = ["a_domain", "b_application", "c_infrastructure", "d_presentation", "pii_guard", "q1_review"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.pyright]
include = ["order_tools/src", "order_tools/demo.py", "pii_guard", "q1_review/order_agent.py"]
extraPaths = ["order_tools/src", "."]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportImplicitOverride = "error"
reportDeprecated = "error"
# SQLModel declares __tablename__ as a declared_attr, so every table DTO that names its table would trip this rule.
reportIncompatibleVariableOverride = false
